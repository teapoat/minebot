# minebot config template. Copy to config.toml and edit, then: sudo systemctl restart minebot

[server]
log_path = "/path/to/server/logs/latest.log"
mc_host = "127.0.0.1"
mc_port = 25565

[features]
deaths = true
advancements = true
joins = true
server_events = false
online_command = true

[joins]
cooldown_min = 10

[paths]
sessions_csv = "sessions.csv"
